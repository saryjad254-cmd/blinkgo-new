# ─────────────────────────────────────────────────────────
# Prometheus Scrape Configuration for BlinkGo
# ─────────────────────────────────────────────────────────
# Add to your prometheus.yml scrape_configs:
#   - job_name: blinkgo
#     metrics_path: /api/metrics/prometheus
#     static_configs:
#       - targets: ['www.blinkgo.de']

scrape_configs:
  - job_name: blinkgo
    metrics_path: /api/metrics/prometheus
    scheme: https
    authorization:
      credentials_file: /etc/prometheus/secrets/blinkgo-metrics-token
    scrape_interval: 15s
    scrape_timeout: 10s
    static_configs:
      - targets:
          - 'www.blinkgo.de'
        labels:
          service: blinkgo-web
          tier: production
