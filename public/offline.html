<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#08090B">
  <title>Offline | BlinkGo</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 0,rgba(225,6,0,.22),transparent 34rem),#08090b;color:#f7f7f5;font-family:Inter,system-ui,sans-serif;padding:24px}.card{width:min(100%,430px);border:1px solid #292a2e;border-radius:28px;background:#111216;padding:28px;text-align:center;box-shadow:0 28px 90px #000}.logo{width:min(220px,70vw);height:auto}.icon{width:72px;height:72px;border-radius:20px;margin:22px auto 14px}h1{font-size:28px;margin:0}p{color:#a8a9ad;line-height:1.6;margin:12px 0 22px}button{min-height:48px;width:100%;border:0;border-radius:14px;background:linear-gradient(90deg,#e10600,#ff7a00);color:#fff;font:800 15px inherit;cursor:pointer}button:focus-visible{outline:3px solid #ffc107;outline-offset:3px}
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="/brand/blinkgo-official-compact-transparent.png" alt="BlinkGo">
    <img class="icon" src="/brand/blinkgo-app-icon-192-v2.png" alt="">
    <h1>Du bist offline</h1>
    <p>Prüfe deine Internetverbindung. BlinkGo lädt deine aktuellen Bestellungen und Live-Daten, sobald du wieder verbunden bist.</p>
    <button type="button" onclick="location.reload()">Erneut versuchen</button>
  </main>
</body>
</html>
